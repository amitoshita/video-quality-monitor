name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vqm
          POSTGRES_PASSWORD: vqm
          POSTGRES_DB: vqm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vqm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: requirements.txt matches uv.lock (Render installs from it)
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt | diff - requirements.txt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - name: pytest (SQLite)
        run: uv run pytest
      - name: pytest (Postgres)
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://vqm:vqm@localhost:5432/vqm_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid

  # The real app in headless Chrome with a fake camera, against a real backend (SQLite).
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Start the backend
        working-directory: backend
        env:
          CORS_ORIGINS: http://localhost:4173
        run: |
          cp .env.example .env
          uv sync --frozen
          uv run alembic upgrade head
          nohup uv run uvicorn --factory app.main:create_app --port 8000 > ../backend.log 2>&1 &
      - name: Build and serve the frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ../frontend.log 2>&1 &
      - name: Browser tests
        working-directory: e2e
        env:
          E2E_APP_URL: http://localhost:4173
          E2E_API_URL: http://localhost:8000
        run: |
          npm ci
          npm test
      - name: Server logs
        if: failure()
        run: tail -n 100 backend.log frontend.log
