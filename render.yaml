# Render Blueprint for the backend (free plan, no credit card).
# Dashboard: New + → Blueprint → pick this repo. Values marked `sync: false` are asked for once.
services:
  - type: web
    name: vqm-api
    runtime: python
    plan: free
    region: frankfurt # keep it next to the Neon database (AWS eu-central-1)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The free plan has no pre-deploy hook, so migrations run at start. Alembic is idempotent:
    # an up-to-date database is a no-op.
    startCommand: alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    # Redeploy only when the backend changes (not for frontend or docs commits).
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false # Neon *pooled* connection string, ends with ?sslmode=require
      - key: CORS_ORIGINS
        sync: false # exact frontend origin, e.g. https://video-quality-monitor.pages.dev
      - key: MIN_FPS
        value: "15"
      - key: MIN_BRIGHTNESS
        value: "60"
      - key: MAX_BRIGHTNESS
        value: "200"
      - key: MAX_MOTION
        value: "2.0"
      - key: MAX_BATCH_SIZE
        value: "120"
      - key: LOG_LEVEL
        value: INFO
